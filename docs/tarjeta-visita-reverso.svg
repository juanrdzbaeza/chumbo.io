<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" role="img" aria-label="Tarjeta de visita chumbo.io — Reverso" version="1.1">
  <title
     id="title1">Tarjeta de visita reverso — chumbo.io</title>
  <defs
     id="defs3">
    <clipPath
       id="card-clip-r">
      <rect
         x="0"
         y="0"
         width="850"
         height="550"
         rx="28"
         ry="28"
         id="rect1" />
    </clipPath>
    <!-- Fondo mate con gradiente radial sutil -->
    <radialGradient
       id="bg-texture-r"
       cx="70%"
       cy="65%"
       r="80%">
      <stop
         offset="0%"
         stop-color="#181818"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#080808"
         id="stop2" />
    </radialGradient>
    <!-- Glow dorado para el marco del QR -->
    <filter
       id="qr-glow"
       x="-0.039361702"
       y="-0.039361702"
       width="1.0787234"
       height="1.0787234">
      <feGaussianBlur
         in="SourceGraphic"
         stdDeviation="4"
         result="blur"
         id="feGaussianBlur2" />
      <feMerge
         id="feMerge3">
        <feMergeNode
           in="blur"
           id="feMergeNode2" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode3" />
      </feMerge>
    </filter>
    <!-- Brillo logo pequeño -->
    <filter
       id="gloss-r"
       x="-0.024556355"
       y="-0.15948086"
       width="1.0491127"
       height="1.3189617">
      <feGaussianBlur
         in="SourceAlpha"
         stdDeviation="1"
         result="blur"
         id="feGaussianBlur3" />
      <feSpecularLighting
         in="blur"
         surfaceScale="3"
         specularConstant="1"
         specularExponent="25"
         result="specular"
         lighting-color="#ffffff"
         id="feSpecularLighting3">
        <fePointLight
           x="600"
           y="100"
           z="100"
           id="fePointLight3" />
      </feSpecularLighting>
      <feComposite
         in="specular"
         in2="SourceAlpha"
         operator="in"
         result="specular-out"
         id="feComposite3" />
      <feBlend
         in="SourceGraphic"
         in2="specular-out"
         mode="screen"
         id="feBlend3" />
    </filter>
    <!-- Máscara bite del logo pequeño - NO USADA -->
    <!-- mask id="bite-r" eliminada -->
    <clipPath
       id="body-clip-r">
      <ellipse cx="100" cy="130" rx="48" ry="80"/>
    </clipPath>
  </defs>
  <!-- ── FONDO ──────────────────────────────────────────────────── -->
  <rect
     x="0"
     y="0"
     width="850"
     height="550"
     rx="28"
     ry="28"
     fill="url(#bg-texture-r)"
     id="rect4" />
  <!-- Línea de acento en borde inferior (reverso) -->
  <rect
     x="0"
     y="546"
     width="850"
     height="4"
     rx="2"
     fill="#F4A523"
     clip-path="url(#card-clip-r)"
     id="rect5" />
  <!-- ── PATRÓN DECORATIVO DE FONDO (aréolas gigantes) ────────── -->
  <g
     opacity="0.04"
     fill="#9B1D35"
     id="g8">
    <circle
       cx="50"
       cy="50"
       r="80"
       id="circle5" />
    <circle
       cx="800"
       cy="500"
       r="120"
       id="circle6" />
    <circle
       cx="800"
       cy="50"
       r="60"
       id="circle7" />
    <circle
       cx="50"
       cy="500"
       r="90"
       id="circle8" />
  </g>
  <!-- ── QR CODE (imagen embebida como referencia relativa) ─────── -->
  <!-- Marco exterior dorado con glow -->
  <rect
     x="284"
     y="82"
     width="282"
     height="282"
     rx="8"
     ry="8"
     fill="none"
     stroke="#F4A523"
     stroke-width="3"
     filter="url(#qr-glow)"
     opacity="0.9"
     id="rect8" />
  <!-- Fondo blanco para el QR (contraste) -->
  <rect
     x="290"
     y="88"
     width="270"
     height="270"
     rx="4"
     ry="4"
     fill="#FAFAF8"
     id="rect9" />
  <!-- QR embebido (data URI - incrustado en el SVG) -->
  <image
     href="data:image/png;base64,"
     x="298"
     y="96"
     width="254"
     height="254"
     preserveAspectRatio="xMidYMid meet"
     id="image9" />
  <!-- ── TEXTO INFERIOR AL QR ───────────────────────────────────── -->
  <text
     x="425"
     y="412"
     text-anchor="middle"
     font-family="'Space Grotesk', 'Plus Jakarta Sans', Inter, system-ui, sans-serif"
     font-size="18"
     fill="#F4A523"
     letter-spacing="0.5"
     font-weight="500"
     id="text9">Escanea para ir a la web</text>
  <text
     x="425"
     y="443"
     text-anchor="middle"
     font-family="'Space Grotesk', 'Plus Jakarta Sans', Inter, system-ui, sans-serif"
     font-size="22"
     font-weight="700"
     fill="#FAFAF8"
     letter-spacing="-0.2"
     id="text10">chumbo.io</text>
  <!-- ── LOGO PEQUEÑO (esquina sup. izquierda) ─────────────────── -->
  <g
     transform="translate(44, 28) scale(0.26)"
     filter="url(#gloss-r)"
     id="g24">
    <!-- Cuerpo del chumbo - SIN mordisco -->
    <ellipse cx="100" cy="130" rx="48" ry="80" fill="#9B1D35"/>

    <!-- Aréolas -->
    <g fill="#7A1528" clip-path="url(#body-clip-r)">
      <circle cx="70"  cy="85"  r="2.5"/>
      <circle cx="90"  cy="75"  r="2.5"/>
      <circle cx="110" cy="80"  r="2.5"/>
      <circle cx="130" cy="95"  r="2.5"/>
      <circle cx="65"  cy="110" r="2.5"/>
      <circle cx="85"  cy="100" r="2.5"/>
      <circle cx="105" cy="105" r="2.5"/>
      <circle cx="125" cy="120" r="2.5"/>
      <circle cx="60"  cy="135" r="2.5"/>
      <circle cx="80"  cy="125" r="2.5"/>
      <circle cx="100" cy="130" r="2.5"/>
      <circle cx="120" cy="135" r="2.5"/>
      <circle cx="65"  cy="160" r="2.5"/>
      <circle cx="85"  cy="155" r="2.5"/>
      <circle cx="105" cy="160" r="2.5"/>
      <circle cx="125" cy="165" r="2.5"/>
      <circle cx="70"  cy="185" r="2.5"/>
      <circle cx="90"  cy="180" r="2.5"/>
      <circle cx="110" cy="185" r="2.5"/>
      <circle cx="130" cy="190" r="2.5"/>
    </g>

    <!-- Corona floral (característica única del higo chumbo) -->
    <g fill="#9B1D35">
      <ellipse cx="88" cy="52" rx="6" ry="10" transform="rotate(-25 88 52)"/>
      <ellipse cx="100" cy="48" rx="6" ry="12"/>
      <ellipse cx="112" cy="52" rx="6" ry="10" transform="rotate(25 112 52)"/>
      <circle cx="94" cy="57" r="3"/>
      <circle cx="106" cy="57" r="3"/>
    </g>

    <!-- Detalle decorativo naranja en la corona -->
    <g fill="#F4A523" opacity="0.7">
      <circle cx="100" cy="53" r="2.5"/>
      <circle cx="94" cy="58" r="1.5"/>
      <circle cx="106" cy="58" r="1.5"/>
    </g>
   </g>
  <!-- Wordmark pequeño junto al icono -->
  <text
     x="98.042801"
     y="71.589493"
     font-family="'Space Grotesk', 'Plus Jakarta Sans', Inter, system-ui, sans-serif"
     font-size="20px"
     filter="url(#gloss-r)"
     id="text25"><tspan
       font-weight="700"
       fill="#9b1d35"
       id="tspan24">Chumbo</tspan><tspan
       font-weight="300"
       fill="#f4a523"
       id="tspan25">.io</tspan></text>
  <!-- ── TAGLINE FOOTER ─────────────────────────────────────────── -->
  <rect
     x="48"
     y="494"
     width="754"
     height="0.8"
     fill="#F4A523"
     opacity="0.20"
     id="rect25" />
  <text
     x="425"
     y="522"
     text-anchor="middle"
     font-family="'Space Grotesk', 'Plus Jakarta Sans', Inter, system-ui, sans-serif"
     font-size="13"
     fill="#FAFAF8"
     letter-spacing="3"
     opacity="0.35"
     font-weight="400"
     id="text26">SOFTWARE QUE FUNCIONA · SIN HUMO · CHUMBOSOFT S.L.</text>
</svg>
